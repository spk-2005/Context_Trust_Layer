services:
  - type: web
    name: context-trust-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: context-trust-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Context Trust Layer
      - key: LLM_PROVIDER
        value: mock
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: context-trust-db
    plan: free
    databaseName: context_trust
    user: context_user
