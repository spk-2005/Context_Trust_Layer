services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: context-trust-postgres

    environment:
      POSTGRES_DB: context_trust
      POSTGRES_USER: context_user
      POSTGRES_PASSWORD: context_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_user -d context_trust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: