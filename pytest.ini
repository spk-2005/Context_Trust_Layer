[pytest]
testpaths = backend/tests
asyncio_mode = auto
pythonpath = backend .
markers =
    fast: Fast unit and component tests (< 15 seconds) for rapid developer feedback
    unit: Isolated unit tests for individual functions and classes
    component: Component-level pipeline stage tests
    integration: Cross-component pipeline tests on small fixtures
    benchmark: Multi-document benchmark invariant tests
    certification: Full corpus release certification and holdout evaluation tests
